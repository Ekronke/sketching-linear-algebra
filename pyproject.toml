[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "sketchla"
version = "0.1.0"
description = "Randomized sketching for least squares and low-rank approximation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Erik Kronke" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.scikit-build]
wheel.packages = ["src/sketchla"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
